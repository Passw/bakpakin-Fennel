name: Rebase against original repo

#on: [push]
on:
  schedule:
    # https://pubs.opengroup.org/onlinepubs/9699919799/utilities/crontab.html#tag_20_25_07
    # * is a special character in YAML so you have to quote this string
    - cron:  '35 20 * * *'

env:
  GITHUB_TOKEN: ${{ secrets.YOUR_SECRET_NAME }}

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Git configuration
      run: |
        git config user.name "Passw"
        git config user.email "Passw_Passw@163.com"
        git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
        git remote -vv
        git branch -vv
        git log --oneline | wc -l
    - name: RUN `git pull main -r`
      run: |
        pwd
        git remote add up https://git.sr.ht/~technomancy/fennel
        pwd
        git log --oneline | wc -l
        git log --oneline origin/main..main | wc -l
        git status
        git remote -vv
        git log --oneline | wc -l
        git fetch up main
        #git log main..origin/main
        #git log origin/main..main
        #git log main..up/main
        #git log up/main..main
        git pull up main -r
        git log --oneline | wc -l
        pwd
        git status
        git push origin HEAD:main --force
        pwd
        git status
